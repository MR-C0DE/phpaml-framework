name: Public API compatibility

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backward-compatibility:
    name: Compare public API with latest release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
      - name: Select the latest published version
        id: baseline
        shell: bash
        run: |
          tag="$(git tag --sort=-v:refname | head -n 1)"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Comparing HEAD with $tag"
      - name: Reject accidental API breaks
        shell: bash
        run: |
          composer require --dev roave/backward-compatibility-check:^8.0 --with-all-dependencies --no-interaction --no-progress
          vendor/bin/roave-backward-compatibility-check --from="${{ steps.baseline.outputs.tag }}" --format=github-actions

name: Feature proposal
description: Propose a focused improvement to PHPAML Framework.
title: "[Proposal]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user or maintainer problem before proposing a solution.
    validations:
      required: true
  - type: textarea
    id: audience
    attributes:
      label: Who has this problem?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should become easier, safer, or faster?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Scope check
      options:
        - label: This proposal focuses on one problem or outcome.
          required: true
        - label: I searched existing issues and documentation first.
          required: true
